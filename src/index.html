<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark">
  <title>Tauri App</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="/main.js" defer></script>
</head>

<body spellcheck="false">

  <dialog>
    <img src="#">
    <div>&times;</div>
  </dialog>
  <h1 class="app-name engraved">io-interface</h1>

  <div class="lane1">

    <fieldset class="connection">
      <legend>Connection</legend>
      <datalist id="address-list">
        <option value="127.0.0.1"></option>
        <option value="192.168.1.1"></option>
      </datalist>
      <datalist id="port-list">
        <option value="5001"></option>
        <option value="9001"></option>
      </datalist>
      <input id="address" list="address-list" placeholder="IP ADDRESS" style="width: 150px;" value="127.0.0.1" />
      <input id="port" list="port-list" placeholder="PORT" style="width: 70px;" value="5001" />
    </fieldset>
    
    <fieldset class="connection">
      <legend>Script</legend>
      <input type="file" id="preview2" accept=".txt">
      <button id="uploadScript">Upload Script</button>
      <label><input type="checkbox" id="loop">Loop</label>
    </fieldset>
    
    <fieldset class="connection">
      <legend>Cap VNA</legend>
      <button id="capture-vna">Capture</button>
    </fieldset>

    <fieldset class="connection">
      <legend>Log</legend>
      <button id="clear-log">Clear</button>
      <button id="save-log">Save</button>
    </fieldset>
  </div>
  
  <fieldset class="utilities-container">
      <legend>Utilities</legend>
      <div></div>
  </fieldset>
  
  <fieldset class="command">
    <legend>Command</legend>
    <input id="command" list="command-list" placeholder="Enter Command" value="*IDN?" />
    <datalist id="command-list">
      <option value="*IDN?"></option>
      <option value="*RST"></option>
      <option value="adb devices"></option>
      <option value="adb start-server"></option>
      <option value="adb kill-server"></option>
      <option value="adb logcat -d -t 100"></option>
      <option value="adb tcpip 5555"></option>
      <option value="adb connect 192.168.0.10:5555"></option>
    </datalist>
    <button id="send">Send</button>
  </fieldset>
  

  <fieldset class="console">
    <legend>Console</legend>
    <textarea id="message"></textarea>
  </fieldset>

  <footer>
    <div><a href="mailto:ACIN-Wired-Microwave-Support@anritsu.com" class="engraved">ACIN Tech Support</a></div>
    <div><a href="https://anritsu.com" target="_blank" class="engraved">www.anritsu.com</a></div>
    <div class="engraved"><span>Version 4.1.0</span></div>
  </footer>

</body>

</html>
